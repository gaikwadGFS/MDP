<section class="light-background">
    <h2 class="text-center m-3">
        Maha-rera Rules and Regulations
    </h2>



<div class="container mt-3">
    <div class="row">
       
        <div class="col-12 col-md-8 col-lg-6 mx-auto">
            <div class="search-container d-flex flex-column flex-sm-row justify-content-between align-items-start">
                
                <input pInputText [(ngModel)]="searchText" type="text" pSize="large" placeholder="Search Subject..." class="mb-2 mb-sm-0 w-100 w-sm-auto" />

                <!-- Search button -->
                <button pButton label="Search" icon="pi pi-search" class="p-button-sm p-button-primary mb-2 mb-sm-0 ms-sm-2 w-100 w-sm-auto" (click)="search()"></button>

                <!-- Reset button -->
                <button pButton label="Reset" icon="pi pi-refresh" class="p-button-sm p-button-danger w-100 w-sm-auto" (click)="reset()"></button>
            </div>
        </div>
    </div>
</div>





<div class="container">
    <div class="row">
        <div class="col">
            <p-table #dt [value]="documents" [paginator]="true" [rows]="8" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Sr No</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <!-- <th>Document</th> -->
                        <th>Download</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-doc let-i="rowIndex">
                    <tr>
                        <td>{{ i + 1 }}</td>
                        <td>{{ doc.subject }}</td>
                        <td>{{ doc.date | date:'dd/MM/yyyy' }}</td>
                        <!-- <td>{{ doc.documentName }}</td> -->
                        <!-- <td>
                            <p-fileUpload mode="basic" chooseLabel="Upload" (onUpload)="onUpload($event, doc)" [customUpload]="true"></p-fileUpload>
                            <p *ngIf="doc.uploadedFile">{{ doc.uploadedFile.name }}</p>
                        </td> -->
                        <td>
                            <a [href]="doc.fileUrl" download="{{ doc.documentName }}" class="download-link">Click Here</a>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            
        </div>
    </div>
</div>






</section>
