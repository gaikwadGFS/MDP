<div class="container mt-4">
    <h2 class="text-center mb-4">Upload Property for Sale</h2>
  
    <div class="card p-4 shadow">
      <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()">
        
        <div class="grid p-fluid">
          <!-- Property Type & Location -->
          <div class="col-12 md:col-6">
            <label class="form-label">Property Type</label>
            <p-dropdown formControlName="propertyType" [options]="propertyTypes" placeholder="Select Property Type" class="w-100"></p-dropdown>
          </div>
          <div class="col-12 md:col-6">
            <label class="form-label">Location</label>
            <p-dropdown formControlName="location" [options]="locations" placeholder="Select Location" class="w-100"></p-dropdown>
          </div>
  
          <!-- Budget Min & Max -->
          <div class="col-12 md:col-6">
            <label class="form-label">Min Budget</label>
            <input pInputText type="number" formControlName="budgetMin" placeholder="Enter Min Budget" class="w-100" />
          </div>
          <div class="col-12 md:col-6">
            <label class="form-label">Max Budget</label>
            <input pInputText type="number" formControlName="budgetMax" placeholder="Enter Max Budget" class="w-100" />
          </div>
  
          <!-- Size (sq. ft.) -->
          <div class="col-12 md:col-6">
            <label class="form-label">Size (sq. ft.)</label>
            <input pInputText type="number" formControlName="size" placeholder="Enter Size" class="w-100" />
          </div>
  
          <!-- Bedrooms & Bathrooms -->
          <div class="col-12 md:col-6">
            <div class="grid">
              <div class="col-6">
                <label class="form-label">Bedrooms</label>
                <input pInputText type="number" formControlName="bedrooms" placeholder="Bedrooms" class="w-100" />
              </div>
              <div class="col-6">
                <label class="form-label">Bathrooms</label>
                <input pInputText type="number" formControlName="bathrooms" placeholder="Bathrooms" class="w-100" />
              </div>
            </div>
          </div>
  
          <!-- Condition -->
          <div class="col-12 md:col-6">
            <label class="form-label">Condition</label>
            <p-dropdown formControlName="condition" [options]="conditions" placeholder="Select Condition" class="w-100"></p-dropdown>
          </div>
  
          <!-- Payment Mode -->
          <div class="col-12 md:col-6">
            <label class="form-label">Payment Mode</label>
            <p-dropdown formControlName="paymentMode" [options]="paymentModes" placeholder="Select Payment Mode" class="w-100"></p-dropdown>
          </div>
  
          <!-- Possession Date -->
          <div class="col-12 md:col-6">
            <label class="form-label">Possession Date</label>
            <p-calendar formControlName="possessionDate" dateFormat="dd/mm/yy" showIcon="true" class="w-100"></p-calendar>
          </div>
  
          <!-- Legal Compliance -->
          <div class="col-12 md:col-6 d-flex align-items-center">
            <p-checkbox binary="true" formControlName="legalCompliance" inputId="legalCompliance"></p-checkbox>
            <label for="legalCompliance" class="ms-2">Legal Compliance (Title Deed Verified)</label>
          </div>
  
          <!-- Buttons -->
          <div class="col-12 d-flex justify-content-end gap-3 mt-3">
            <p-button label="Reset" type="button" severity="secondary" (click)="onReset()"></p-button>
            <p-button label="Submit" type="submit" severity="primary"></p-button>
          </div>
  
        </div>
  
      </form>
    </div>
  </div>
